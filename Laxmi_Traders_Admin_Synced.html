<style>
:root{--or:#ea580c;--or-d:#c2410c;--or-bg:#FFF1E8;--ink:#1c1917;--muted:#6b6560;--line:#ece7e1;--bg:#faf8f5;--card:#fff;--ok:#12804A;--ok-bg:#DDF5E7;--err:#C62828;--err-bg:#FDE4E2;--warn-bg:#FEF0D6;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(234,88,12,.4);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.fw{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1.5px solid var(--or);background:var(--or);color:#fff;font-weight:650;text-decoration:none}
.btn:hover{background:var(--or-d);border-color:var(--or-d)}
.btn.ghost{background:#fff;color:var(--or);}.btn.ghost:hover{background:var(--or-bg)}
.btn.danger{background:var(--err);border-color:var(--err)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:block;margin-bottom:14px}.field>span{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search],input[type=number],select,textarea{width:100%;min-height:44px;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--or);outline:3px solid rgba(234,88,12,.12)}
textarea{min-height:90px;resize:vertical}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:650;background:#f1ece6}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.or{background:var(--or-bg);color:var(--or-d)}
.err-t{color:var(--err);font-size:13px;min-height:18px;margin:2px 0 8px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:550}.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(28,25,23,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.sheet h2{font-size:19px;margin-bottom:10px}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 8px 16px}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--or);color:#fff}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nv{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:11px;background:none;color:var(--muted);font-weight:650}
.nv:hover{background:var(--or-bg);color:var(--or-d)}.nv.on{background:var(--or-bg);color:var(--or-d)}
.sp{flex:1}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:30;border-right:0;border-bottom:1px solid var(--line)}.side .logo,.sp{display:none}.nv{width:auto;white-space:nowrap}}
.main{padding:24px 28px 60px;max-width:1000px;min-width:0}@media(max-width:820px){.main{padding:16px 14px 60px}}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.ph h1{font-size:23px;flex:1}.sub{color:var(--muted);font-size:14px;flex-basis:100%;margin-top:-6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.panel h2{font-size:16px;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:11px 12px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}.tr{text-align:right}
.bl{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--or-bg);color:var(--or-d);font-weight:800;overflow:hidden;flex:none}.bl img{width:100%;height:100%;object-fit:contain;background:#fff}
.bl.sq{border-radius:10px}.bl.sq img{object-fit:cover}
.drop{border:2px dashed #d9cfc4;border-radius:16px;padding:30px 18px;text-align:center;background:var(--bg)}.drop.over{border-color:var(--or);background:var(--or-bg)}.drop b{font-size:17px}
.maprow{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin-bottom:8px}.maprow label{font-size:13.5px;font-weight:650}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:620px){.g2{grid-template-columns:1fr}}
.radio{display:flex;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}.radio.on{border-color:var(--or);background:var(--or-bg)}.radio b{display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .panel{width:min(380px,100%);padding:26px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}.thumbs div{border:1px solid var(--line);border-radius:12px;padding:6px;font-size:11.5px;text-align:center;background:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumbs img{width:100%;height:80px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}.thumbs .no{border-color:#f3b5b0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi>span{font-size:13px;color:var(--muted);font-weight:600;display:block}.kpi b{display:block;font-size:25px;letter-spacing:-.5px;margin-top:2px}
.kpi.hot{background:var(--or-bg);border-color:#f7c9ad}
select.ost{width:auto;min-height:36px;padding:4px 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}.sec-h h2{font-size:17px;margin:0;flex:1}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}

/* ---------- visual refinement layer ---------- */
:root{scroll-behavior:smooth}
body{overflow-x:hidden}
button,a,.btn,.panel,.kpi,.nv,.drop,.radio,.thumbs div{transition:background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .25s ease,transform .25s cubic-bezier(.2,.75,.25,1),opacity .25s ease}
.btn{box-shadow:0 4px 12px rgba(194,65,12,.11)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(194,65,12,.18)}
.btn:active{transform:translateY(0) scale(.98)}
.side{box-shadow:4px 0 22px rgba(28,25,23,.025)}
.logo i{box-shadow:0 5px 14px rgba(234,88,12,.2)}
.nv{position:relative}
.nv::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:8px;background:var(--or);transform:scaleY(0);transition:transform .2s ease}
.nv.on::before{transform:scaleY(1)}
.nv:hover{transform:translateX(2px)}
.main{animation:adminEnter .35s ease both}
.panel,.kpi{box-shadow:0 3px 14px rgba(28,25,23,.025)}
.panel:hover,.kpi:hover{box-shadow:0 10px 28px rgba(28,25,23,.06);border-color:#f1d3c2}
th{position:sticky;top:0;z-index:1}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#fffaf6}
.drop:hover{border-color:var(--or);background:var(--or-bg)}
.drop.over{transform:scale(1.008);box-shadow:0 8px 24px rgba(234,88,12,.1)}
.login .panel{box-shadow:0 24px 70px rgba(28,25,23,.1);animation:loginIn .45s cubic-bezier(.2,.8,.2,1) both}
.login .logo i{width:42px;height:42px;font-size:19px}
.toast{box-shadow:0 10px 28px rgba(0,0,0,.16);animation:toastIn .25s ease both}
@keyframes adminEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loginIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:820px){.side{box-shadow:0 5px 18px rgba(28,25,23,.04)}.nv:hover{transform:translateY(-1px)}.main{padding-top:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.logo i.lg{background:none!important;box-shadow:none!important;width:46px!important;height:46px!important;border-radius:50%;overflow:hidden;padding:0}.logo i.lg img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}.login .logo i.lg{width:64px!important;height:64px!important}@media(max-width:760px){.head .logo i.lg{width:40px!important;height:40px!important}}</style></head><body>

function resize(file,max,type){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,.8))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Not an image: '+file.name))};im.src=u})}

const FIELDS=[['name','Firecracker name *',['name','productname','product','itemname','item','title','particulars','description']],['price','Price *',['price','rate','mrp','wholesaleprice','caseprice','sellingprice','amount','pricepercase']],['sku','SKU / code',['sku','code','itemcode','productcode','id','itemno']],['brand','Brand / company',['brand','company','manufacturer','make']],['category','Category',['category','type','group','section','range']],['pack','Pack details',['pack','packing','packsize','unit','content','contents']],['cartons','Cartons in stock',['cartons','carton','stock','stockcartons','cartonsinstock','quantity','qty']]];
function autoMap(h){const H=h.map(norm),m={},used=new Set();
 for(const[f,,syn]of FIELDS){const i=H.findIndex((x,k)=>!used.has(k)&&x&&syn.includes(x));if(i>=0){m[f]=i;used.add(i)}}
 for(const[f,,syn]of FIELDS){if(m[f]!=null)continue;const i=H.findIndex((x,k)=>!used.has(k)&&x&&syn.some(s=>s.length>2&&x.includes(s)));if(i>=0){m[f]=i;used.add(i)}}return m}
const numv=v=>{if(typeof v==='number')return v;const s=String(v??'').replace(/[₹$,\s]|^rs\.?/gi,'');return s===''?NaN:Number(s)};
function parseCSV(t){t=t.replace(/^﻿/,'');const f=t.split(/\r?\n/,1)[0],d=[',',';','\t'].map(x=>[x,f.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
async function inflate(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder(),files={};let e=-1;
 for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw new Error('not a zip');let n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true);
 for(let k=0;k<n;k++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  files[dec.decode(u8.subarray(p+46,p+46+nl))]={m,cs,off};p+=46+nl+el+cl}
 return async name=>{const f=files[name];if(!f)return null;const ln=dv.getUint16(f.off+26,true),le=dv.getUint16(f.off+28,true),s=f.off+30+ln+le,raw=u8.subarray(s,s+f.cs);return dec.decode(f.m===0?raw:await inflate(raw))}}
async function readXlsx(buf){const get=await unzip(buf),xml=s=>new DOMParser().parseFromString(s,'application/xml');
 const wb=xml(await get('xl/workbook.xml')),rels=xml(await get('xl/_rels/workbook.xml.rels')),tg={};
 $$('Relationship',rels).forEach(r=>tg[r.getAttribute('Id')]=r.getAttribute('Target'));
 const sh=$$('sheet',wb).map(s=>{let t=(tg[s.getAttribute('r:id')]||'').replace(/^\//,'');return{name:s.getAttribute('name'),path:t.startsWith('xl/')?t:'xl/'+t}});
 const ss=[],sx=await get('xl/sharedStrings.xml');if(sx)$$('si',xml(sx)).forEach(si=>ss.push($$('t',si).map(t=>t.textContent).join('')));
 const col=ref=>{let n=0;for(const ch of ref.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
 return{names:sh.map(s=>s.name),async rows(i){const d=xml(await get(sh[i].path)),out=[];
  $$('row',d).forEach(r=>{const row=[];$$('c',r).forEach(c=>{const t=c.getAttribute('t'),v=c.querySelector('v'),ix=col(c.getAttribute('r')||'A1');let val='';

  '<div class="row fw"><select class="ost" data-ostatus="'+esc(o.id)+'" aria-label="Order status">'+STATUSES.map(x=>'<option'+(x===s?' selected':'')+'>'+x+'</option>').join('')+'</select>'+(wa?'<a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa)+'">WhatsApp customer</a>':'')+'<button class="btn danger sm" style="margin-left:auto" data-act="delOrder" data-id="'+esc(o.id)+'">Delete order</button></div>')},
 closeModal(){closeModal()},
 delOrder(el){if(!confirm('Delete this order permanently?'))return;saveOrders(getOrders().filter(x=>x.id!==el.dataset.id));cloudDelOrder(el.dataset.id);A.ordRaw=rawOrders();closeModal();toast('Order deleted','ok');render()},
 exportOrders(){dl('laxmi-traders-orders.csv',csv([['Order ID','Date','Name','Phone','Email','Address','Delivery date','Notes','Items','Cartons','Total','Status'],...sortedOrders().map(o=>{const c=o.customer||{};return [o.id,oDate(o),c.name,c.phone,c.email,c.address,c.deliveryDate,c.notes,(o.items||[]).map(i=>i.name+' x'+i.qty).join('; '),oCartons(o),o.total,oStatus(o)]})]))},
 exportWebsite(){dl('laxmi-traders-catalogue.json',JSON.stringify(DB,null,2),'application/json')},
 backup(){dl('laxmi-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json')},
 wipe(){if(confirm('Delete all brands, products and photos?'))mutate(d=>{d.brands=[];d.products=[]})}
};
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){A.view=n.dataset.nav;render();return}const el=e.target.closest('[data-act]');if(el&&Act[el.dataset.act])Act[el.dataset.act](el)});
document.addEventListener('input',e=>{if(e.target.id==='oq'){A.oq=e.target.value;refreshOrders();return}if(e.target.id==='pq'){A.q=e.target.value;$('#pbody').innerHTML=prodRows(DB.products.filter(p=>!A.q||(p.name+p.sku+p.brand).toLowerCase().includes(A.q.toLowerCase())))}});
document.addEventListener('change',async e=>{const t=e.target;
 try{
 if(t.dataset.ostatus!==undefined){setOrderStatus(t.dataset.ostatus,t.value)}
  else if(t.id==='ofilter'){A.of=t.value;refreshOrders()}
  else if(t.dataset.stock){const q=Number(t.value);if(Number.isInteger(q)&&q>=0){const r=mutate(d=>{const p=d.products.find(x=>x.id===t.dataset.stock);if(p)p.cartons=q});if(r.error)toast(r.error,'err');else toast('Stock updated','ok')}else toast('Enter a whole number of cartons (0 or more)','err')}
  else if(t.id==='file'&&t.files[0]){const rows=await readSheet(t.files[0]);A.si=0;setRows(rows,t.files[0].name);renderMain()}
 else if(t.id==='sheetSel'){A.si=+t.value;setRows(await A.getSheet(A.si),A.imp.name);renderMain()}
 else if(t.dataset.map!==undefined){A.imp.map[t.dataset.map]=t.value===''?null:+t.value;renderMain()}
 else if(t.id==='photoFiles')await handlePhotos(t.files);
 else if(t.dataset.logo){const f=t.files[0];if(!f)return;const data=await resize(f,240,'image/png');const r=mutate(d=>{const b=d.brands.find(x=>x.id===t.dataset.logo);if(b)b.logo=data});toast(r.error||'Logo updated',r.error?'err':'ok')}
 else if(t.dataset.pphoto){const f=t.files[0];if(!f)return;const data=await resize(f,520,'image/jpeg');const r=mutate(d=>{const p=d.products.find(x=>x.id===t.dataset.pphoto);if(p)p.photo=data});toast(r.error||'Photo saved',r.error?'err':'ok')}
 else if(t.id==='restore'&&t.files[0]){const d=JSON.parse(await t.files[0].text());if(!valid(d))throw new Error('Not a valid backup file.');if(confirm('Replace all current data with this backup?')){mutate(x=>{Object.keys(x).forEach(k=>delete x[k]);Object.assign(x,d,{rev:Date.now()})});toast('Restored','ok')}}
 }catch(er){toast(er.message||'Something went wrong','err')}
 if(t.type==='file'&&t.id!=='file'&&t.id!=='photoFiles')t.value=''});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=$('#drop')||$('#drop2');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');
 if(ev==='drop'&&e.dataTransfer.files.length){if($('#drop2'))handlePhotos(e.dataTransfer.files);else readSheet(e.dataTransfer.files[0]).then(r=>{A.si=0;setRows(r,e.dataTransfer.files[0].name);renderMain()}).catch(er=>toast(er.message,'err'))}}));
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-submit]');if(!f)return;e.preventDefault();
 const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim(),err=m=>{const x=$('#fe',f)||$('#le',f);if(x)x.textContent=m},k=f.dataset.submit;
 if(k==='login'){const em=g('email').toLowerCase();if(ADMINS.includes(em)&&sha256(String(fd.get('pw')||''))===PASS_HASH){authed=true;adminUser=em;try{sessionStorage.setItem('lt_admin_user',em)}catch(x){}render()}else err('Incorrect email or password.')}
 else if(k==='brand'){const name=g('name');if(name.length<2)return err('Enter the company name.');if(DB.brands.some(b=>b.name.toLowerCase()===name.toLowerCase()))return err('That brand already exists.');
  let logo='';const file=fd.get('logo');try{if(file&&file.size)logo=await resize(file,240,'image/png')}catch(x){return err(x.message)}
  const r=mutate(d=>{d.brands.push({id:'b_'+uid(),name,logo})});if(r.error)return err(r.error);toast('Brand added','ok')}
 else if(k==='settings'){if(!g('name'))return err('Business name is required.');mutate(d=>{['name','tagline','phone','whatsapp','email','address'].forEach(x=>d.settings[x]=g(x))});toast('Saved','ok')}
 else if(k==='product'){const name=g('name'),sku=g('sku'),brand=g('brand'),category=g('category'),pack=g('pack'),price=Number(g('price')),cartons=g('cartons')===''?0:Number(g('cartons'));
  if(!name)return err('Enter the product name.');if(g('price')===''||isNaN(price)||price<0)return err('Enter a valid price.');if(!Number.isInteger(cartons)||cartons<0)return err('Cartons must be a whole number (0 or more).');
  if(DB.products.some(p=>sku?(p.sku&&p.sku.toLowerCase()===sku.toLowerCase()):p.name.toLowerCase()===name.toLowerCase()))return err('A product with this '+(sku?'SKU':'name')+' already exists.');
  let photo='';const file=fd.get('photo');try{if(file&&file.size)photo=await resize(file,520,'image/jpeg')}catch(x){return err(x.message)}
  const r=mutate(d=>{let b=brand;if(brand){const ex=d.brands.find(x=>x.name.toLowerCase()===brand.toLowerCase());if(ex)b=ex.name;else d.brands.push({id:'b_'+uid(),name:brand,logo:''})}
   d.products.push({id:'p_'+uid()+uid(),sku,name,price,brand:b,category,pack,photo,cartons})});
  if(r.error)return err(r.error);toast('Product added to the catalogue','ok')}});
onChange(src=>{if(!authed)return;const a=document.activeElement;if(src==='remote'&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;if(A.view==='import'&&A.imp)return;if(A.view==='photos'&&A.photos)return;
 const m=$('#main');if(m){renderMain();const s=$('.side .logo div');if(s)s.firstChild.textContent=DB.settings.name}});
A.ordRaw=rawOrders();
function ordersChanged(){const r=rawOrders();if(r===A.ordRaw)return;A.ordRaw=r;const m=$('#modal'),f=document.activeElement;if(!authed||(m&&!m.hidden)||(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)))return;render()}
addEventListener('storage',e=>{if(e.key===ORDERS_KEY)ordersChanged()});setInterval(ordersChanged,2000);
function cloudSetOrder(o){if(cloud)fetch(cloud+'/orders/'+encodeURIComponent(o.id)+'.json',{method:'PUT',body:JSON.stringify(o)}).catch(()=>{})}
function cloudDelOrder(id){if(cloud)fetch(cloud+'/orders/'+encodeURIComponent(id)+'.json',{method:'DELETE'}).catch(()=>{})}
async function cloudOrders(){if(!cloud)return;try{const r=await fetch(cloud+'/orders.json'),d=await r.json();if(!d)return;const local=getOrders(),ids=new Set(local.map(o=>o.id)),add=Object.values(d).filter(o=>o&&o.id&&!ids.has(o.id));if(add.length&&saveOrders(local.concat(add)))ordersChanged()}catch(e){}}
if(cloud){cloudPull();cloudOrders();setInterval(cloudPull,10000);setInterval(cloudOrders,10000)}
render();


/* Motion and usability enhancements */
(()=>{
 const app=document.querySelector('#app');
 if(app&&'MutationObserver'in window){
   const observer=new MutationObserver(()=>{
     document.querySelectorAll('.main .panel,.main .kpi,.main .tw').forEach((el,i)=>{
       if(!el.dataset.motionReady){el.dataset.motionReady='1';el.style.animationDelay=Math.min(i*35,180)+'ms';el.classList.add('motion-enter')}
     });
   });
   observer.observe(app,{childList:true,subtree:true});
 }
 document.addEventListener('keydown',e=>{
   if(e.key==='Escape'){
     const modal=document.querySelector('.overlay:not([hidden])');
     if(modal){modal.hidden=true;modal.setAttribute('aria-hidden','true')}
   }
 });
})();
